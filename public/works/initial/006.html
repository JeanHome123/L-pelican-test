<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: radial-gradient(120% 100% at 50% 0%, #e6f4ff 0%, #c9e4f8 45%, #a8cfec 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: #2f3542;
  }
  .stage { width: min(980px, 100%); }
  .frame {
    background: #fff;
    padding: 10px;
    border-radius: 24px;
    box-shadow: 0 30px 64px -20px rgba(28, 58, 88, .48), 0 2px 6px rgba(28, 58, 88, .12);
  }
  svg { display: block; width: 100%; height: auto; border-radius: 16px; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-top: 14px; padding: 0 8px;
  }
  .title { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .title em { font-style: normal; color: #8492a6; font-weight: 400; margin-left: 8px; font-size: 13px; }
  button {
    font: inherit; font-size: 13px; font-weight: 600; color: #2f3542;
    background: #eef4fa; border: 1px solid #d7e3ef; border-radius: 999px;
    padding: 7px 16px; cursor: pointer; transition: background .18s, transform .18s;
  }
  button:hover { background: #e2edf8; }
  button:active { transform: scale(.97); }

  /* —— 背景视差：云朵漂移 —— */
  .cloud { animation: drift 46s linear infinite; }
  @keyframes drift {
    from { transform: translateX(1020px); }
    to   { transform: translateX(-320px); }
  }

  /* —— 路面标线滚动（与车轮同速：130px / .25s） —— */
  .dashes { animation: scroll 0.25s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-130px); } }
  .dashes2 { animation: scroll2 0.18s linear infinite; }
  @keyframes scroll2 { from { transform: translateX(0); } to { transform: translateX(-160px); } }

  /* —— 速度线 —— */
  .streak { animation: streak 1.2s linear infinite; }
  @keyframes streak {
    0%   { transform: translateX(46px);  opacity: 0; }
    18%  { opacity: .85; }
    68%  { opacity: .85; }
    100% { transform: translateX(-150px); opacity: 0; }
  }

  body.paused .cloud,
  body.paused .dashes,
  body.paused .dashes2,
  body.paused .streak { animation-play-state: paused; }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">
    <svg id="scene" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="一只鹈鹕骑着自行车在公路上飞驰的动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#bfe4ff"/>
          <stop offset="0.55" stop-color="#dcf0ff"/>
          <stop offset="1"   stop-color="#f2faff"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0"   stop-color="#ffe08a" stop-opacity=".95"/>
          <stop offset="0.55" stop-color="#ffd166" stop-opacity=".35"/>
          <stop offset="1"   stop-color="#ffd166" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b9e3d3"/>
          <stop offset="1" stop-color="#9fd6c2"/>
        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fd0ac"/>
          <stop offset="1" stop-color="#6fbf95"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4b5568"/>
          <stop offset="1" stop-color="#333c4d"/>
        </linearGradient>
        <linearGradient id="bodyG" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0"   stop-color="#ffffff"/>
          <stop offset="0.62" stop-color="#f6f9fd"/>
          <stop offset="1"   stop-color="#dfe8f2"/>
        </linearGradient>
        <linearGradient id="wingG" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0"   stop-color="#ffffff"/>
          <stop offset="1"   stop-color="#dbe5f0"/>
        </linearGradient>
        <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0.4">
          <stop offset="0"   stop-color="#ffc24a"/>
          <stop offset="0.6" stop-color="#f5a02f"/>
          <stop offset="1"   stop-color="#e2841f"/>
        </linearGradient>
        <linearGradient id="pouchG" x1="0" y1="0" x2="0.2" y2="1">
          <stop offset="0"   stop-color="#ffcf6b"/>
          <stop offset="0.7" stop-color="#f7ae44"/>
          <stop offset="1"   stop-color="#e8932c"/>
        </linearGradient>
        <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
      </defs>

      <!-- ══════════ 天空 ══════════ -->
      <rect width="900" height="560" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g transform="translate(772,96)">
        <circle r="66" fill="url(#sunGlow)"/>
        <g stroke="#ffd166" stroke-width="5" stroke-linecap="round" opacity=".85">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                            dur="52s" repeatCount="indefinite"/>
          <line x1="0" y1="-46" x2="0" y2="-62"/>
          <line x1="0" y1="46"  x2="0" y2="62"/>
          <line x1="-46" y1="0" x2="-62" y2="0"/>
          <line x1="46" y1="0"  x2="62" y2="0"/>
          <line x1="-33" y1="-33" x2="-44" y2="-44"/>
          <line x1="33" y1="33"   x2="44" y2="44"/>
          <line x1="33" y1="-33"  x2="44" y2="-44"/>
          <line x1="-33" y1="33"  x2="-44" y2="44"/>
        </g>
        <circle r="38" fill="#ffd166"/>
        <circle r="38" fill="none" stroke="#ffe6a3" stroke-width="4" opacity=".7"/>
      </g>

      <!-- 云朵 -->
      <g fill="#ffffff" opacity=".92">
        <g transform="translate(0,0)">
          <g class="cloud" style="animation-duration:52s; animation-delay:-14s">
            <ellipse cx="0" cy="0" rx="48" ry="25"/>
            <ellipse cx="-38" cy="9" rx="31" ry="17"/>
            <ellipse cx="38" cy="8" rx="34" ry="19"/>
            <ellipse cx="6" cy="-17" rx="29" ry="21"/>
          </g>
        </g>
        <g transform="translate(0,0)">
          <g class="cloud" style="animation-duration:74s; animation-delay:-40s">
            <ellipse cx="0" cy="132" rx="34" ry="17"/>
            <ellipse cx="-26" cy="138" rx="22" ry="12"/>
            <ellipse cx="26" cy="137" rx="24" ry="13"/>
            <ellipse cx="4" cy="120" rx="21" ry="15"/>
          </g>
        </g>
        <g transform="translate(0,0)">
          <g class="cloud" style="animation-duration:38s; animation-delay:-6s">
            <ellipse cx="0" cy="212" rx="26" ry="13" opacity=".8"/>
            <ellipse cx="-20" cy="216" rx="17" ry="9" opacity=".8"/>
            <ellipse cx="20" cy="215" rx="18" ry="10" opacity=".8"/>
            <ellipse cx="3" cy="202" rx="16" ry="11" opacity=".8"/>
          </g>
        </g>
      </g>

      <!-- ══════════ 远景 ══════════ -->
      <path d="M0,437 L0,352 Q 118,300 236,352 Q 330,392 424,346 Q 520,296 640,356 Q 762,410 900,330 L900,437 Z"
            fill="url(#hillFar)"/>
      <path d="M0,437 L0,398 Q 150,364 300,402 Q 430,434 566,392 Q 706,348 900,404 L900,437 Z"
            fill="url(#hillNear)"/>

      <!-- ══════════ 公路 ══════════ -->
      <rect x="0" y="437" width="900" height="123" fill="url(#road)"/>
      <rect x="0" y="437" width="900" height="5" fill="#6b7794" opacity=".8"/>

      <!-- 中线（滚动） -->
      <g class="dashes" fill="#f2f6fb" opacity=".85">
        <rect x="-130" y="499" width="70" height="9" rx="4.5"/>
        <rect x="0"    y="499" width="70" height="9" rx="4.5"/>
        <rect x="130"  y="499" width="70" height="9" rx="4.5"/>
        <rect x="260"  y="499" width="70" height="9" rx="4.5"/>
        <rect x="390"  y="499" width="70" height="9" rx="4.5"/>

        <rect x="910"  y="499" width="70" height="9" rx="4.5"/>
        <rect x="1040" y="499" width="70" height="9" rx="4.5"/>
      </g>
      <!-- 近处路面纹理（更快，制造速度感） -->
      <g class="dashes2" fill="#8f9ab2" opacity=".45">

        <line class="streak" style="animation-delay:-.9s"  x1="110" y1="382" x2="196" y2="382"/>
        <line class="streak" style="animation-delay:-.35s" x1="40" y1="424" x2="108" y2="424"/>
      </g>

      <!-- 地面阴影 -->
      <ellipse cx="446" cy="443" rx="196" ry="11" fill="#0d1524" opacity=".22" filter="url(#soft)"/>

      <!-- ══════════ 自行车 ══════════ -->

                            dur="0.75s" repeatCount="indefinite"/>
          <circle cx="330" cy="375" r="52" fill="none" stroke="#e3ecf5" stroke-width="4"/>
          <g stroke="#eef5fc" stroke-width="2">
            <line x1="330" y1="323" x2="330" y2="427"/>
            <line x1="330" y1="323" x2="330" y2="427" transform="rotate(30 330 375)"/>

        <!-- 前轮 -->

                            dur="0.75s" repeatCount="indefinite"/>
          <circle cx="562" cy="375" r="52" fill="none" stroke="#e3ecf5" stroke-width="4"/>
          <g stroke="#eef5fc" stroke-width="2">
            <line x1="562" y1="323" x2="562" y2="427"/>
            <line x1="562" y1="323" x2="562" y2="427" transform="rotate(30 562 375)"/>

            <line x1="562" y1="323" x2="562" y2="427" transform="rotate(90 562 375)"/>
            <line x1="562" y1="323" x2="562" y2="427" transform="rotate(120 562 375)"/>
            <line x1="562" y1="323" x2="562" y2="427" transform="rotate(150 562 375)"/>
          </g>
          <circle cx="562" cy="375" r="9" fill="#93a1b8"/>

        <!-- 链条 -->
        <g stroke="#9aa5b8" stroke-width="3.5" stroke-dasharray="3 4" fill="none">
          <path d="M445,366 L330,366"/>
          <path d="M445,404 L330,385"/>
        </g>
        <circle cx="330" cy="375" r="11" fill="#8f9bb3"/>

        <!-- 车架 -->
        <g stroke="#12808f" stroke-width="8" fill="none" stroke-linecap="round">
          <path d="M330,375 L445,385"/>
          <path d="M330,375 L410,275"/>
          <path d="M445,385 L410,275"/>
          <path d="M410,275 L536,262"/>
          <path d="M445,385 L546,288"/>
          <path d="M546,288 L562,375"/>
          <path d="M542,288 L556,375" stroke="#0e6b78"/>
        </g>
        <path d="M536,262 L546,288" stroke="#12808f" stroke-width="12" stroke-linecap="round"/>

        <!-- 车座 -->
        <path d="M372,272 C 384,258 424,256 436,268 C 440,272 438,280 430,281 L 382,281 C 374,281 369,277 372,272 Z"
              fill="#2f3542"/>
        <path d="M378,274 C 392,266 420,265 430,271" stroke="#4a5468" stroke-width="2.5" fill="none" opacity=".8"/>

        <!-- 车把 -->
        <path d="M536,262 L533,242 C 532,233 539,229 547,231 C 559,235 569,241 575,245"
              fill="none" stroke="#2f3542" stroke-width="7" stroke-linecap="round"/>
        <path d="M559,239 L579,247" stroke="#1a2029" stroke-width="13" stroke-linecap="round"/>
        <circle cx="524" cy="252" r="5" fill="#ffd166" stroke="#e0a93c" stroke-width="1.5"/>

        <!-- 曲柄 + 脚踏 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 445 385" to="360 445 385"
                            dur="1.1s" repeatCount="indefinite"/>
          <circle cx="445" cy="385" r="19" fill="none" stroke="#b9c4d4" stroke-width="4"/>
          <circle cx="445" cy="385" r="7" fill="#8f9bb3"/>
          <line x1="445" y1="385" x2="477" y2="385" stroke="#2f3542" stroke-width="7" stroke-linecap="round"/>
          <line x1="445" y1="385" x2="413" y2="385" stroke="#1a2029" stroke-width="7" stroke-linecap="round"/>
          <!-- 远侧脚踏（反向旋转保持水平） -->
          <g id="pedal-far">
            <animateTransform attributeName="transform" type="rotate" from="360 413 385" to="0 413 385"
                              dur="1.1s" repeatCount="indefinite"/>
            <rect x="400" y="379" width="26" height="12" rx="4" fill="#1a2029"/>
          </g>
          <!-- 近侧脚踏 -->
          <g id="pedal-near">
            <animateTransform attributeName="transform" type="rotate" from="360 477 385" to="0 477 385"
                              dur="1.1s" repeatCount="indefinite"/>
            <rect x="464" y="379" width="26" height="12" rx="4" fill="#2f3542"/>
          </g>
        </g>
      </g>

      <!-- ══════════ 鹈鹕 ══════════ -->
      <!-- 远侧翅膀（在身体后面扑扇） -->

        <animateTransform attributeName="transform" type="rotate"
                          values="0 390 205; -17 390 205; 4 390 205; -17 390 205; 0 390 205"
                          keyTimes="0; 0.28; 0.5; 0.75; 1"
                          calcMode="spline"
                          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
                          dur="1.9s" repeatCount="indefinite"/>
        <path d="M390,205 C 366,182 336,160 300,146 C 296,164 306,186 324,200 C 348,218 372,220 390,205 Z"
              fill="url(#wingG)" stroke="#cbd8e6" stroke-width="2"/>
        <path d="M300,146 C 316,160 334,176 344,192 C 330,184 312,168 300,146 Z" fill="#2f3542" opacity=".85"/>
      </g>

      <!-- 远侧腿 -->
      <g transform="translate(418,240)">
        <g id="leg-far">
          <animateTransform attributeName="transform" type="rotate" calcMode="linear"
            values="51.06;44.86;37.58;30.03;23.80;20.64;21.38;25.65;32.48;40.72;49.09;56.06;60.16;61.01;59.36;55.93;51.06"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"

              <animateTransform attributeName="transform" type="rotate" calcMode="linear"
                values="81.83;92.49;100.75;105.38;105.53;101.16;93.09;82.55;70.76;59.00;48.85;42.54;42.33;48.31;58.30;70.01;81.83"

                    values="-132.89;-137.35;-138.33;-135.41;-129.33;-121.80;-114.47;-108.20;-103.24;-99.71;-97.93;-98.60;-102.49;-109.33;-117.65;-125.94;-132.89"
                    keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
                    dur="1.1s" repeatCount="indefinite"/>
                  <path d="M-16,-7 C -10,-16 6,-17 20,-12 C 27,-10 31,-5 30,1 C 29,6 22,8 14,8 L -8,8 C -15,7 -18,1 -16,-7 Z"
                        fill="#b8671f"/>
                  <path d="M-2,-2 L24,-6 M-2,2 L24,1" stroke="#9c531a" stroke-width="1.6" opacity=".7"/>
                </g>
              </g>
            </g>
          </g>

      </g>

      <!-- 身体（随踩踏轻微起伏） -->
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 0 -3.5; 0 0; 0 2.5; 0 0"
                          keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="spline"
                          keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"

        <path d="M330,262 C 306,244 308,206 340,188 C 372,170 424,166 452,186 C 476,204 474,238 448,254 C 418,272 356,278 330,262 Z"
              fill="url(#bodyG)" stroke="#dbe5f0" stroke-width="2"/>
        <!-- 尾羽 -->
        <path d="M322,248 C 298,246 276,250 260,260 C 278,266 300,264 318,260 Z" fill="#e8eef6"/>
        <path d="M264,258 L286,256 M268,262 L292,260" stroke="#c3d0e0" stroke-width="2" opacity=".8"/>
      </g>

      <!-- 近侧腿 -->
      <g transform="translate(418,240)">
        <g id="leg-near">
          <animateTransform attributeName="transform" type="rotate" calcMode="linear"
            values="32.48;40.72;49.09;56.06;60.16;61.01;59.36;55.93;51.06;44.86;37.58;30.03;23.80;20.64;21.38;25.65;32.48"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"

          <path d="M0,0 L96,0" stroke="#f2a03d" stroke-width="14" stroke-linecap="round"/>
          <g transform="translate(96,0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" calcMode="linear"

                dur="1.1s" repeatCount="indefinite"/>
              <path d="M0,0 L96,0" stroke="#e8902e" stroke-width="11" stroke-linecap="round"/>
              <circle cx="0" cy="0" r="8" fill="#f2a03d"/>
              <g transform="translate(96,0)">
                <g id="foot-near">
                  <animateTransform attributeName="transform" type="rotate" calcMode="linear"
                    values="-103.24;-99.71;-97.93;-98.60;-102.49;-109.33;-117.65;-125.94;-132.89;-137.35;-138.33;-135.41;-129.33;-121.80;-114.47;-108.20;-103.24"

                    dur="1.1s" repeatCount="indefinite"/>

                        fill="#f2a03d"/>
                  <path d="M-2,-2 L25,-7 M-2,3 L25,2" stroke="#cf7c22" stroke-width="1.8" opacity=".75"/>

              </g>

        <ellipse cx="512" cy="141" rx="31" ry="27" fill="url(#bodyG)" stroke="#dbe5f0" stroke-width="2"/>

  </div>

  <div class="bar">
    <div class="title">鹈鹕骑自行车 <em>纯 SVG + CSS/SMIL 动画</em></div>
    <button id="toggle" type="button">⏸ 暂停</button>
  </div>
</div>

<script>
  const svg = document.getElementById('scene');
  const btn = document.getElementById('toggle');
  let playing = true;

  function setPlaying(v) {
    playing = v;
    if (playing) svg.unpauseAnimations(); else svg.pauseAnimations();
    document.body.classList.toggle('paused', !playing);
    btn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  }

  btn.addEventListener('click', () => setPlaying(!playing));

  // 尊重系统「减少动态效果」偏好：默认停在第一帧，可手动播放
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setPlaying(false);
  }
</script>
