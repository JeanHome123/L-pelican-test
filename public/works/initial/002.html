<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #dfe9f3 0%, #f8fbff 100%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main {
    text-align: center;
    background: #ffffff;
    padding: 32px 40px 24px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(30, 60, 90, 0.12);
  }
  h1 { margin: 0 0 16px; font-size: 26px; color: #2c3e50; letter-spacing: 2px; }
  svg { max-width: 100%; height: auto; border-radius: 14px; display: block; }
  .tip { margin: 14px 0 0; font-size: 13px; color: #90a4ae; }
</style>
</head>
<body>
<main>
  <h1>🚲 鹈鹕骑行记</h1>

  <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只戴红帽子的鹈鹕骑着红色自行车，车轮转动、双腿蹬踏板、背景后退的 2D 动画">
    <desc>SVG 手绘风格的鹈鹕骑自行车 2D 动画：车轮旋转、曲柄与双腿同步蹬踏、身体起伏、云朵/草地/路面后退。</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#aee3ff"/>
        <stop offset="1" stop-color="#eaf8ff"/>
      </linearGradient>

      <!-- 云朵 -->
      <g id="cloud" fill="#ffffff" opacity="0.9">
        <ellipse cx="140" cy="92" rx="46" ry="20"/>
        <ellipse cx="178" cy="82" rx="34" ry="17"/>
        <ellipse cx="106" cy="84" rx="28" ry="14"/>
      </g>
      <g id="cloudset">
        <use href="#cloud"/>
        <g transform="translate(300,-26) scale(0.75)"><use href="#cloud"/></g>
        <g transform="translate(560,44) scale(0.6)"><use href="#cloud"/></g>
      </g>

      <!-- 草丛与小花 -->
      <g id="tuft" stroke="#5a8f3d" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M0,0 C-2,-8 -8,-11 -11,-5"/>
        <path d="M0,0 C-1,-10 3,-14 7,-9"/>
        <path d="M0,0 C4,-8 10,-9 13,-3"/>
      </g>
      <g id="flower">
        <line x1="0" y1="0" x2="0" y2="-9" stroke="#5a8f3d" stroke-width="2"/>
        <circle cy="-12" r="4" fill="#f06292"/>
        <circle cy="-12" r="1.6" fill="#fff3e0"/>
      </g>
      <g id="tuftset">
        <use href="#tuft" x="0"/>
        <use href="#flower" x="160"/>
        <use href="#tuft" x="320"/>
        <use href="#tuft" x="480"/>
        <use href="#flower" x="640"/>
        <use href="#tuft" x="800"/>
        <use href="#tuft" x="960"/>
      </g>
    </defs>

    <!-- ====== 背景 ====== -->
    <rect x="0" y="0" width="800" height="520" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g transform="translate(688,84)">
      <g stroke="#ffd54f" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <line x1="48" y1="0" x2="62" y2="0"/>
        <line x1="33.9" y1="33.9" x2="43.8" y2="43.8"/>
        <line x1="0" y1="48" x2="0" y2="62"/>
        <line x1="-33.9" y1="33.9" x2="-43.8" y2="43.8"/>
        <line x1="-48" y1="0" x2="-62" y2="0"/>
        <line x1="-33.9" y1="-33.9" x2="-43.8" y2="-43.8"/>
        <line x1="0" y1="-48" x2="0" y2="-62"/>
        <line x1="33.9" y1="-33.9" x2="43.8" y2="-43.8"/>
      </g>
      <circle r="52" fill="#ffd54f" opacity="0.25"/>
      <circle r="40" fill="#ffd54f"/>
    </g>

    <!-- 云（无缝滚动） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="38s" repeatCount="indefinite"/>
      <use href="#cloudset"/>
      <use href="#cloudset" x="800"/>
    </g>

    <!-- 草地 / 公路 -->
    <rect x="0" y="428" width="800" height="24" fill="#7cb342"/>
    <rect x="0" y="452" width="800" height="68" fill="#64748b"/>

    <!-- 草丛滚动（速度与车轮线速度一致） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -160 0" dur="0.4s" repeatCount="indefinite"/>
      <g transform="translate(0,446)">
        <use href="#tuftset"/>
      </g>
    </g>

    <!-- 公路中线虚线 -->
    <line x1="-20" y1="487" x2="820" y2="487" stroke="#f4f6f7" stroke-width="6" stroke-dasharray="34 26">
      <animate attributeName="stroke-dashoffset" values="0;60" dur="0.15s" repeatCount="indefinite"/>
    </line>

    <!-- 速度线 -->
    <line x1="150" y1="215" x2="95" y2="215" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="275" x2="70" y2="275" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="335" x2="90" y2="335" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </line>

    <!-- 后轮扬起的灰尘 -->
    <circle cx="170" cy="449" r="5" fill="#cfd8dc" opacity="0">
      <animate attributeName="cx" values="172;138" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;9" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="452" r="5" fill="#cfd8dc" opacity="0">
      <animate attributeName="cx" values="168;132" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;8" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- 车影 -->
    <ellipse cx="400" cy="456" rx="205" ry="9" fill="#000" opacity="0.16"/>

    <!-- ====== 车与鸟（整体轻微起伏） ====== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" dur="0.55s" repeatCount="indefinite"/>

      <!-- 远侧腿（深色，反相蹬踏） -->
      <path fill="none" stroke="#b35b13" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="translate(8,3)"
        d="M360,270 L415,328 L355,380 L369,378">
        <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
          keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
          values="M360,270 L415,328 L355,380 L369,378;
                  M360,270 L423,320 L358,367 L372,365;
                  M360,270 L430,308 L365,355 L379,353;
                  M360,270 L436,294 L377,348 L391,346;
                  M360,270 L439,282 L390,345 L404,343;
                  M360,270 L440,277 L403,348 L417,346;
                  M360,270 L439,279 L415,355 L429,353;
                  M360,270 L438,288 L422,367 L436,365;
                  M360,270 L434,300 L425,380 L439,378;
                  M360,270 L427,314 L422,393 L436,391;
                  M360,270 L418,325 L415,405 L429,403;
                  M360,270 L410,333 L403,412 L417,410;
                  M360,270 L405,336 L390,415 L404,413;
                  M360,270 L404,337 L377,412 L391,410;
                  M360,270 L406,336 L365,405 L379,403;
                  M360,270 L410,333 L358,393 L372,391;
                  M360,270 L415,328 L355,380 L369,378"/>
      </path>

      <!-- 后轮 -->
      <g transform="translate(240,380)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
          <line x1="-60" y1="0" x2="60" y2="0" stroke="#8a8f98" stroke-width="3"/>
          <line x1="-42.4" y1="-42.4" x2="42.4" y2="42.4" stroke="#8a8f98" stroke-width="3"/>
          <line x1="0" y1="-60" x2="0" y2="60" stroke="#8a8f98" stroke-width="3"/>
          <line x1="-42.4" y1="42.4" x2="42.4" y2="-42.4" stroke="#8a8f98" stroke-width="3"/>
          <line x1="0" y1="-52" x2="0" y2="-62" stroke="#4b5563" stroke-width="4"/>
          <circle r="60" fill="none" stroke="#666b73" stroke-width="4"/>
          <circle r="70" fill="none" stroke="#2f3640" stroke-width="11"/>
          <circle r="7" fill="#333"/>
        </g>
      </g>

      <!-- 前轮 -->
      <g transform="translate(560,380)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
          <line x1="-60" y1="0" x2="60" y2="0" stroke="#8a8f98" stroke-width="3"/>
          <line x1="-42.4" y1="-42.4" x2="42.4" y2="42.4" stroke="#8a8f98" stroke-width="3"/>
          <line x1="0" y1="-60" x2="0" y2="60" stroke="#8a8f98" stroke-width="3"/>
          <line x1="-42.4" y1="42.4" x2="42.4" y2="-42.4" stroke="#8a8f98" stroke-width="3"/>
          <line x1="0" y1="-52" x2="0" y2="-62" stroke="#4b5563" stroke-width="4"/>
          <circle r="60" fill="none" stroke="#666b73" stroke-width="4"/>
          <circle r="70" fill="none" stroke="#2f3640" stroke-width="11"/>
          <circle r="7" fill="#333"/>
        </g>
      </g>

      <!-- 链条（虚线滚动模拟传动） -->
      <circle cx="240" cy="380" r="7" fill="none" stroke="#444" stroke-width="3"/>
      <path d="M240,373 L390,363" stroke="#555" stroke-width="3" stroke-dasharray="5 3" fill="none">
        <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.09s" repeatCount="indefinite"/>
      </path>
      <path d="M390,397 L240,387" stroke="#555" stroke-width="3" stroke-dasharray="5 3" fill="none">
        <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.09s" repeatCount="indefinite"/>
      </path>

      <!-- 车架 -->
      <path d="M240,380 L390,380 M390,380 L358,254 M240,380 L362,260 M390,380 L509,298 M502,260 L512,302 M362,262 L504,262 M512,302 L560,380"
            stroke="#d64545" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 车座 -->
      <line x1="358" y1="252" x2="362" y2="260" stroke="#555" stroke-width="5"/>
      <ellipse cx="350" cy="250" rx="19" ry="6" fill="#333"/>

      <!-- 车把 -->
      <path d="M503,263 L512,240 Q518,231 532,233" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="534" cy="234" r="5" fill="#222"/>

      <!-- 齿盘 -->
      <circle cx="390" cy="380" r="16" fill="none" stroke="#444" stroke-width="5"/>

      <!-- 曲柄 + 双踏板（踏板反向自转保持水平） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 390 380" to="360 390 380" dur="1.1s" repeatCount="indefinite"/>
        <line x1="355" y1="380" x2="425" y2="380" stroke="#333" stroke-width="7" stroke-linecap="round"/>
        <rect x="341" y="375" width="26" height="9" rx="4" fill="#6b7280">
          <animateTransform attributeName="transform" type="rotate" from="0 354 379.5" to="-360 354 379.5" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="412" y="375.5" width="26" height="9" rx="4" fill="#374151">
          <animateTransform attributeName="transform" type="rotate" from="0 425 380" to="-360 425 380" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- ====== 鹈鹕 ====== -->
      <!-- 尾羽 -->
      <path d="M258,198 L214,176 L246,206 L204,204 L242,220 L212,232 L256,224 Z"
            fill="#f7f7f2" stroke="#d8d8d0" stroke-width="2" stroke-linejoin="round"/>

      <!-- 脖子（先描边后填充） -->
      <path d="M384,196 C418,188 436,160 448,130" stroke="#d8d8d0" stroke-width="27" fill="none" stroke-linecap="round"/>
      <path d="M384,196 C418,188 436,160 448,130" stroke="#f7f7f2" stroke-width="23" fill="none" stroke-linecap="round"/>

      <!-- 身体 -->
      <ellipse cx="328" cy="208" rx="84" ry="50" transform="rotate(-8 328 208)" fill="#f7f7f2" stroke="#d8d8d0" stroke-width="2.5"/>
      <ellipse cx="340" cy="224" rx="56" ry="28" transform="rotate(-8 340 224)" fill="#ffffff" opacity="0.55"/>

      <!-- 头 -->
      <circle cx="456" cy="120" r="23" fill="#f7f7f2" stroke="#d8d8d0" stroke-width="1.5"/>

      <!-- 反戴的小红帽 -->
      <line x1="434" y1="112" x2="421" y2="104" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
      <path d="M433,113 Q456,84 479,111 Z" fill="#e74c3c"/>
      <circle cx="456" cy="90" r="3" fill="#c0392b"/>

      <!-- 眼睛 -->
      <circle cx="464" cy="116" r="3.2" fill="#263238"/>
      <circle cx="465.3" cy="114.6" r="1.1" fill="#ffffff"/>

      <!-- 大嘴（上喙 + 喉囊） -->
      <path d="M471,115 Q532,116 594,133 Q566,143 524,141 Q494,139 473,129 Z"
            fill="#f39c12" stroke="#d68910" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="478" y1="121" x2="516" y2="124" stroke="#d68910" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M473,127 C476,158 514,172 552,156 C572,148 586,139 593,134 C560,141 520,143 475,131 Z"
            fill="#f5b041" stroke="#d68910" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- 近侧腿（橙色，与曲柄同步蹬踏） -->
      <path fill="none" stroke="#e67e22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
        d="M360,270 L434,300 L425,380 L439,378">
        <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
          keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
          values="M360,270 L434,300 L425,380 L439,378;
                  M360,270 L427,314 L422,393 L436,391;
                  M360,270 L418,325 L415,405 L429,403;
                  M360,270 L410,333 L403,412 L417,410;
                  M360,270 L405,336 L390,415 L404,413;
                  M360,270 L404,337 L377,412 L391,410;
                  M360,270 L406,336 L365,405 L379,403;
                  M360,270 L410,333 L358,393 L372,391;
                  M360,270 L415,328 L355,380 L369,378;
                  M360,270 L423,320 L358,367 L372,365;
                  M360,270 L430,308 L365,355 L379,353;
                  M360,270 L436,294 L377,348 L391,346;
                  M360,270 L439,282 L390,345 L404,343;
                  M360,270 L440,277 L403,348 L417,346;
                  M360,270 L439,279 L415,355 L429,353;
                  M360,270 L438,288 L422,367 L436,365;
                  M360,270 L434,300 L425,380 L439,378"/>
      </path>

      <!-- 翅膀（伸向车把） -->
      <path d="M336,198 C390,172 452,186 536,234 C500,248 424,252 362,234 C344,226 334,212 336,198 Z"
            fill="#eef3f7" stroke="#cfd8dc" stroke-width="2" stroke-linejoin="round"/>
      <path d="M366,206 C412,194 458,200 500,224" stroke="#cfd8dc" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M358,220 C402,212 446,216 482,234" stroke="#cfd8dc" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </svg>

  <p class="tip">纯 SVG + SMIL 动画 · 双腿按逆运动学计算蹬踏 · 用浏览器打开即可观看</p>
</main>
</body>
</html>
